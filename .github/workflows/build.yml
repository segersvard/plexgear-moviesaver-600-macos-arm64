name: Build and parser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test parser and compile ARM64 prototype
        run: make test all
      - name: Check offline recovery tool syntax
        run: python3 -m py_compile tools/recover.py tools/make-mov.py
